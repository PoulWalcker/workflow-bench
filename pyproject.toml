[project]
name = "workflow-bench"
version = "0.1.0"
description = "Workflow Bench bootstrap"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build==0.12.4"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.17.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]
markers = [
  "integration: real Harbor/n8n control; requires --run-integration",
  "model: paid model control; requires explicit permission and finite limits",
]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
