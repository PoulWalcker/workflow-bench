[project]
name = "workflow-bench"
version = "0.1.0"
description = "Native Task loading and public Composer packages"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "harbor==0.24.0",
    "jsonschema>=4.26.0",
    "referencing>=0.37.0",
]

[build-system]
requires = ["uv_build==0.12.4"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.17.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]
markers = [
  "integration: real Harbor/Docker control; requires --run-integration",
  "model: paid model control; requires explicit permission and finite limits",
]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.uv.build-backend]
module-name = ["workflow_bench", "workflow_bench_integrations"]
