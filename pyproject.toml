[project]
name = "workflow-bench"
version = "0.1.0"
description = "Native Task loading and public Composer packages"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "harbor==0.24.0",
    "jsonschema>=4.26.0",
    "referencing>=0.37.0",
]

[project.scripts]
wb = "workflow_bench.cli:main"

[build-system]
requires = ["uv_build==0.12.4"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    # ty is pre-1.0: an exact pin keeps its diagnostics stable across hosts.
    "ty==0.0.86",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]
markers = [
  "integration: real Harbor/Docker control; requires --run-integration",
  "model: paid model control; requires explicit permission and finite limits",
]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "W",    # pycodestyle warnings
    "A",    # flake8-builtins
    "EXE",  # flake8-executable
    "ISC",  # flake8-implicit-str-concat
    "G",    # flake8-logging-format
    "I",    # import order
    "T20",  # flake8-print
    "TID",  # flake8-tidy-imports
    "PGH",  # pygrep-hooks
    "PLC",  # Pylint conventions
    "PLE",  # Pylint errors
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]

[tool.ruff.lint.per-file-ignores]
# The stdio MCP server speaks newline JSON-RPC: stdout is its protocol channel.
"src/workflow_bench/mcp.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ty.src]
include = ["src", "tests"]

[tool.uv.build-backend]
module-name = ["workflow_bench", "workflow_bench_integrations"]
