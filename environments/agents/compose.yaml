# Single source of the local `agents` image tag; build only, no service is started.
name: workflow-bench-agents
services:
  agents:
    image: workflow-bench-agents:codex-0.162.1
    build:
      context: .
      # The repository root; the build reads only uv.lock and the evaluation
      # helper sources from it, and BuildKit transfers only those paths.
      additional_contexts:
        project: ../..
