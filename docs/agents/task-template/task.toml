schema_version = "1.4"
# Answer tasks: the result directory is collected for the separate verifier.
artifacts = ["/work/output"]

[metadata]
level = "L1"  # L1 | L2 | L3a | L3b
horizon = "single"  # single | repeated

[environment]
build_timeout_sec = 600.0
network_mode = "no-network"

[agent]
timeout_sec = 600.0

[verifier]
environment_mode = "separate"
timeout_sec = 120.0
